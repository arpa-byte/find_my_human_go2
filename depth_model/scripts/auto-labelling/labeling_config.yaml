# =============================================
# Auto-Labeling Configuration (YOLOv8 on RGB videos + Depth visualization)
# =============================================

# === Input & Output Paths ===
raw_data_root: "/home/arpan/masterthesis/depth/find_my_human_go2/raw_data"
processed_labels_root: "/home/arpan/masterthesis/depth/find_my_human_go2/depth_model/processed_dataset"

# === Which session to label (change this each time) ===
session_name: "2026_03_16_19_47_29_session01"   # ← EDIT THIS to match your folder name

# === YOLO Model Settings ===
yolo_model: "yolov8n.pt"          # or yolov8s.pt for better accuracy (slower)
confidence_threshold: 0.45        # Minimum detection confidence
iou_threshold: 0.45               # NMS IoU threshold
classes: [0]                      # Only person class (COCO class 0)

# === RGB Visualization & Video ===
save_visualizations: true
rgb_vis_subfolder: "rgb_vis"
vis_color: [0, 255, 0]            # green boxes
vis_thickness: 2
create_labeled_video: true
labeled_video_subfolder: "rgb_video_vis"
labeled_video_name: "labeled_rgb_video.mp4"
video_codec: "mp4v"
video_fps: 30

# === Depth Visualization (copy + draw same boxes) ===
save_depth_visualizations: true
depth_copy_subfolder: "depth_copy"        # copied original depth jpgs
depth_vis_subfolder: "depth_vis"          # depth with drawn boxes