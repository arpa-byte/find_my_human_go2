# Freiburg depth-only person detection – safe for M2 Mac CPU

data: /Volumes/SamsungT7/thesis_ws_two/find_my_human_go2/ml_ws/datasets/frieburg_rgbd/preprocess/data.yaml

model: yolov8n.pt

# Training
epochs: 2                  # start very small to test stability
batch: 4                   # safe memory usage on M2 Air
imgsz: 640
workers: 4
device: cpu                # force CPU

# Optimizer (SGD more stable on CPU)
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Light augmentation (depth is sensitive)
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.0
mixup: 0.0

# Logging & output
project: runs/detect
name: train_freiburg_yolov8
exist_ok: true
save_period: 2             # save every 2 epochs (more frequent for testing)
plots: true
verbose: true